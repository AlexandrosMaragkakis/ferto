name: Verify and deploy
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      apply_migrations:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run secrets:install
      - run: npm run check:secrets -- --ref HEAD
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npx playwright install --with-deps chromium
      - run: npm run release:prepare
      - run: npm run check:secrets -- --ref HEAD --artifact .release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: .release/
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 3
  deploy:
    name: Deploy production
    needs: verify
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.FERTO_CD_ENABLED == 'true' &&
      github.repository == vars.FERTO_DEPLOY_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ferto-production
      cancel-in-progress: false
    env:
      FERTO_DEPLOY_REPOSITORY: ${{ vars.FERTO_DEPLOY_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: .release/
      - name: Validate and target the exact verified release
        id: prepare
        run: node scripts/deploy-ci.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FERTO_INSTANCE_CONFIG: ${{ secrets.FERTO_INSTANCE_CONFIG }}
          FERTO_BACKUP_PUBLIC_KEY: ${{ secrets.FERTO_BACKUP_PUBLIC_KEY }}
      - name: Export, restore-check and encrypt the backup
        run: node scripts/deploy-ci.mjs backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save encrypted backup before any live change
        id: backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferto-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-upload/backup.gpg
          if-no-files-found: error
          retention-days: 14
      - name: Download the saved encrypted backup for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.backup.outputs.artifact-id }}
          path: .local/ci-roundtrip/
          merge-multiple: true
      - name: Deploy with verified backup and Queue safeguards
        run: node scripts/deploy-ci.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FERTO_BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          FERTO_APPLY_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations && 'true' || 'false' }}
      - name: Encrypt operational recovery evidence
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/deploy-ci.mjs logs
      - name: Save encrypted operational recovery evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferto-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-logs/operations.gpg
          if-no-files-found: ignore
          retention-days: 14
